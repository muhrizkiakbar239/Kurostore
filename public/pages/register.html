<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3f6">
  <meta name="description" content="Buat akun Kurostore dan mulai belanja dengan mudah.">
  <title>Daftar | Kurostore</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261103-1">
  <script src="../../assets/js/style.js?v=20261109-2" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-back-link" href="../index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5m6 6-6-6 6-6"></path>
      </svg>
      Kembali ke beranda
    </a>

    <section class="auth-card" aria-labelledby="register-title">
      <a class="auth-brand" href="../index.html" aria-label="Kurostore, kembali ke beranda">
        <img src="../../images/kurostore-cart-logo.png" alt="Kurostore" width="2172" height="724">
      </a>

      <div class="auth-heading">
        <span class="auth-heading-kicker">GABUNG BERSAMA KUROSTORE</span>
        <h1 id="register-title">Buat akun baru</h1>
        <p>Daftar untuk pengalaman belanja yang lebih mudah.</p>
      </div>

      <form class="auth-form" id="register-form">
        <div class="auth-field">
          <label for="register-name">Nama lengkap</label>
          <input
            id="register-name"
            name="name"
            type="text"
            placeholder="Masukkan nama lengkap"
            autocomplete="name"
            required
          >
        </div>

        <div class="auth-field">
          <label for="register-email">Email</label>
          <input
            id="register-email"
            name="email"
            type="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="auth-field">
          <label for="register-password">Kata sandi</label>
          <div class="auth-password-wrap">
            <input
              id="register-password"
              name="password"
              type="password"
              placeholder="Minimal 8 karakter"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button
              class="auth-password-toggle"
              type="button"
              aria-label="Tampilkan kata sandi"
              aria-pressed="false"
              aria-controls="register-password"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="2.7"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label for="register-password-confirm">Konfirmasi kata sandi</label>
          <div class="auth-password-wrap">
            <input
              id="register-password-confirm"
              name="password-confirm"
              type="password"
              placeholder="Ulangi kata sandi"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button
              class="auth-password-toggle"
              type="button"
              aria-label="Tampilkan kata sandi"
              aria-pressed="false"
              aria-controls="register-password-confirm"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="2.7"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button class="auth-submit" type="submit">
          Daftar
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6"></path>
          </svg>
        </button>
        <p class="auth-feedback" id="register-feedback" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-register-prompt">
        Sudah punya akun?
        <a href="login.html">Masuk di sini</a>
      </p>

      <p class="auth-terms">
        Dengan mendaftar, kamu menyetujui ketentuan layanan dan kebijakan privasi Kurostore.
      </p>
    </section>
  </main>
</body>
</html>
